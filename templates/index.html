<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Kakkoii Kana</title>
    <link href="{{ url_for('static', filename='styles/style.css')}}" rel="stylesheet" />
    <style>
        .correct { color: green; }
        .incorrect { color: red; }
    </style>
</head>

<body>
    <h1> {{ word }}</h1>
    <form id="quizForm" method="post">
        <input type="text" name="response" id="response" placeholder="Romaji" />
        <button type="submit">Submit</button>
    </form>
    <p><span id="feedback"></span></p>

    <script>
        document.getElementById('quizForm').addEventListener('submit', async (e) => {
            e.preventDefault();
            const response = document.getElementById('response').value;
            const res = await fetch('/', {
                method: 'POST',
                headers: { 'Content-Type': 'application/x-www-form-urlencoded' },
                body: `response=${encodeURIComponent(response)}`
            });
            const data = await res.json();
            document.querySelector('h1').textContent = data.word;

            const feedback = document.getElementById('feedback');
            if (data.correct === true) {
                feedback.textContent = 'Correct!';
                feedback.className = 'correct';
            } else if (data.correct === false) {
                feedback.textContent = `Incorrect — answer was "${data.correct_answer}"`;
                feedback.className = 'incorrect';
            }

            document.getElementById('response').value = '';
        });
    </script>

</body>
</html>
