<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Kakkoii Kana</title>
    <link href="{{ url_for('static', filename='styles/style.css')}}" rel="stylesheet" />
    <style>
        .correct { color: green; }
        .incorrect { color: red; }
    </style>
</head>

<body>
    <h1> {{ word }} </h1>
    <form id="quizForm" method="post">
        <input type="text" name="response" id="response" placeholder="Romaji" />
        <button type="submit">Submit</button>
    </form>
    <p><span id="feedback"></span></p>
    <p id="reveal"></p>
    <p id="score">
        Correct: <span id="correctCount" class="correct">0</span> &mdash;
        Incorrect: <span id="incorrectCount" class="incorrect">0</span>
    </p>

    <script>
        let correctCount = 0;
        let incorrectCount = 0;

        document.getElementById('quizForm').addEventListener('submit', async (e) => {
            e.preventDefault();
            const response = document.getElementById('response').value;
            const res = await fetch('/', {
                method: 'POST',
                headers: { 'Content-Type': 'application/x-www-form-urlencoded' },
                body: `response=${encodeURIComponent(response)}`
            });
            const data = await res.json();
            document.querySelector('h1').textContent = data.word;

            const feedback = document.getElementById('feedback');
            if (data.correct === true) {
                feedback.textContent = 'Correct!';
                feedback.className = 'correct';
                correctCount++;
            } else if (data.correct === false) {
                feedback.textContent = `Incorrect — answer was "${data.correct_answer}"`;
                feedback.className = 'incorrect';
                incorrectCount++;
            }

            document.getElementById('correctCount').textContent = correctCount;
            document.getElementById('incorrectCount').textContent = incorrectCount;

            // Reveal what the word actually was, once it has been answered.
            const reveal = document.getElementById('reveal');
            if (data.correct === null || data.correct === undefined) {
                reveal.textContent = '';
            } else {
                const parts = [];
                if (data.kanji) parts.push(data.kanji);
                if (data.meaning && data.meaning.length) parts.push(data.meaning.join(', '));
                reveal.textContent = parts.join(' — ');
            }

            document.getElementById('response').value = '';
        });
    </script>

</body>
</html>
